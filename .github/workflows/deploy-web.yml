name: Deploy Web (CF Worker via OpenNext)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy to CF Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm --filter web type-check

      - name: Build with OpenNext for Cloudflare
        run: pnpm --filter web deploy:cf

      - name: Verify .open-next exists
        run: |
          if [ ! -d "apps/web/.open-next" ]; then
            echo "::error::.open-next directory not created"
            exit 1
          fi
          ls -la apps/web/.open-next/

      - name: Ensure R2 cache bucket exists
        working-directory: apps/web
        run: |
          if ! npx --no wrangler@4 r2 bucket list 2>/dev/null | grep -q "inventorypro-web-cache"; then
            echo "Creating R2 bucket inventorypro-web-cache..."
            npx --no wrangler@4 r2 bucket create inventorypro-web-cache
          else
            echo "R2 bucket inventorypro-web-cache already exists"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Worker via wrangler
        working-directory: apps/web
        run: |
          npx --no wrangler@4 deploy \
            --name=inventorypro-web \
            --compatibility-date=2024-09-23 \
            --compatibility-flags=nodejs_compat \
            --main=.open-next/worker.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
