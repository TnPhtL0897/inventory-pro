name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infrastructure/supabase/**"
      - "vercel.json"
      - "fly.toml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check web
        run: pnpm type-check

      - name: Test web
        run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Test API
        run: dotnet test apps/api/InventoryPro.sln --configuration Release --logger "console;verbosity=normal"
        env:
          DOTNET_NOLOGO: true

  # ---------------------------------------------------------------------------
  # 2. Build web + push to Vercel
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web → Vercel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ---------------------------------------------------------------------------
  # 3. Build API image + deploy to Fly.io
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API → Fly.io
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Restore
        run: dotnet restore apps/api/InventoryPro.sln

      - name: Publish
        run: dotnet publish apps/api/src/InventoryPro.API/InventoryPro.API.csproj -c Release -o ./publish --no-restore

      - name: Install Fly CLI
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy to Fly.io
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly deploy --config fly.toml --dockerfile apps/api/Dockerfile --strategy bluegreen --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4. Apply Supabase migrations (nếu có thay đổi)
  # ---------------------------------------------------------------------------
  migrate-db:
    name: Apply DB migrations
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }} --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. Smoke test sau deploy
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test prod
    needs: [deploy-web, deploy-api, migrate-db]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check API
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "${{ secrets.API_BASE_URL }}/health/live" >/dev/null; then
              echo "✅ API live"
              break
            fi
            sleep 10
          done
          curl -fsSL "${{ secrets.API_BASE_URL }}/health/ready" || (echo "❌ API ready failed"; exit 1)

      - name: Health check Web
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "${{ secrets.WEB_URL }}/login" >/dev/null; then
              echo "✅ Web live"
              break
            fi
            sleep 10
          done
          curl -fsSL "${{ secrets.WEB_URL }}/login" | grep -q "Đăng nhập" || (echo "❌ Web login page missing"; exit 1)
