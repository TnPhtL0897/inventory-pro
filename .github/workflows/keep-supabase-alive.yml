name: Keep Supabase alive

# Supabase Free tier pauses project sau 7 ngày không có API request.
# Cron này ping mỗi 5 ngày để giữ project active.
# Workflow này free (GitHub Actions cho public repos: unlimited).

on:
  schedule:
    # Mỗi 5 ngày lúc 03:00 UTC (10:00 VN)
    - cron: "0 3 */5 * *"
  workflow_dispatch:  # Cho phép chạy tay

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        run: |
          # Gọi một endpoint lightweight để trigger activity
          response=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          if [ "$response" = "200" ] || [ "$response" = "401" ]; then
            echo "✅ Supabase ping OK (HTTP $response)"
          else
            echo "⚠️ Supabase ping unexpected: HTTP $response"
            exit 1
          fi

      - name: Ping Fly.io API (keep warm)
        run: |
          # Ping mỗi 5 ngày là đủ để trigger Supabase activity.
          # Nếu muốn giữ Fly VM warm (tránh cold start), tạo workflow riêng mỗi 3 phút.
          curl -sS -o /dev/null -w "Fly health: %{http_code}\n" \
            "${{ secrets.API_BASE_URL }}/health/live" || true
