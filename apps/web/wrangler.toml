# =============================================================================
# Cloudflare Workers configuration for apps/web (OpenNext adapter)
# =============================================================================
# @opennextjs/cloudflare v1.x targets Cloudflare Workers (not Pages).
# Worker entry: .open-next/worker.js
# Static assets served via ASSETS binding from .open-next/assets
# =============================================================================

name = "inventorypro-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = ".open-next/worker.js"

assets = { directory = ".open-next/assets", binding = "ASSETS" }

services = [
  # Self-reference service binding (required by OpenNext caching layer)
  { binding = "WORKER_SELF_REFERENCE", service = "inventorypro-web" }
]

# R2 incremental cache disabled — requires CLOUDFLARE_API_TOKEN with R2 scope.
# Enable by:
#   1. Grant token "Workers R2 Storage" + "Account R2: Edit" permissions
#   2. Create bucket: `wrangler r2 bucket create inventorypro-web-cache`
#   3. Uncomment r2_buckets below and re-enable r2IncrementalCache in
#      open-next.config.ts
# r2_buckets = [
#   { binding = "NEXT_INC_CACHE_R2_BUCKET", bucket_name = "inventorypro-web-cache" }
# ]

[vars]
NEXTJS_ENV = "production"

# Secrets (set via `wrangler secret put` or CF dashboard, NOT committed):
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL (already inlined at build via .env.production)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY (already inlined at build via .env.production)
