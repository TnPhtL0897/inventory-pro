# =============================================================================
# Cloudflare Workers (NOT Pages) configuration
# =============================================================================
# Dự án này deploy chính lên Vercel. File wrangler.toml giữ lại để tham khảo
# cho Cloudflare Workers (Edge API nếu cần) nhưng KHÔNG dùng cho build.
#
# Để deploy lên Cloudflare Pages: dùng @opennextjs/cloudflare (xem git log)
# Để deploy lên Vercel: chỉ cần `next build` (Vercel tự detect)

name = "inventorypro-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
