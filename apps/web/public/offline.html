<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline - Quản lý kho vật tư Pro</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 2rem; max-width: 480px; margin: 4rem auto; text-align: center; }
    h1 { color: #0f172a; margin-bottom: 0.5rem; }
    p { color: #64748b; line-height: 1.5; }
    button { margin-top: 1.5rem; padding: 0.5rem 1rem; background: #0f172a; color: white; border: none; border-radius: 0.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Mất kết nối</h1>
  <p>Bạn đang offline. Một số tính năng (xem dữ liệu đã cache) vẫn khả dụng. Vui lòng kết nối mạng để đồng bộ.</p>
  <button onclick="location.reload()">Thử lại</button>
</body>
</html>
