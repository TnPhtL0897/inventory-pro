# Fly.io configuration cho InventoryPro API — $0 (free tier)
# Free tier: 3 shared VMs 256MB RAM mỗi. Dùng 1 VM 24/7 (đủ cho MVP).
# Scale-to-zero tự động tắt VMs idle. Cold start ~5-15s.
# Docs: https://fly.io/docs/reference/configuration/

app = "inventory-prod"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  release_command = "echo 'DB migrations are run via supabase db push from CI, not at deploy time.'"
  strategy = "bluegreen"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER = "true"
  # Secrets set via: fly secrets set KEY=value
  # Required: Supabase__Url, Supabase__JwtSecret, Supabase__AnonKey, Supabase__ServiceRoleKey
  #           ConnectionStrings__Supabase

[experimental]
  auto_rollback = true

# =============================================================================
# Service: 1 process group "app" (1+ machines sẽ tự scale theo traffic)
# =============================================================================
[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Concurrency: 1 machine có thể xử lý 250 connections
  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  # TCP check: machine còn alive
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  # HTTP health check
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health/live"
    protocol = "http"
    protocol = "http"

# =============================================================================
# VM: shared-cpu-1x với 256MB RAM (nằm trong free tier)
# =============================================================================
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Auto-scaling: tắt VMs khi idle để tiết kiệm allowance
[[services.machine_checks]]
  command = "/bin/true"

[metrics]
  port = 8080
  path = "/metrics"
